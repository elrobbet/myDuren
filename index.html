<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>myDuren</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="script.js" defer></script>
        <style>
            select {
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
                background-image: url("data:image/svg+xml;charset=UTF-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
                background-repeat: no-repeat;
                background-position: right 0.5rem center;
                background-size: 1em;
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                select {
                    padding-right: 2rem !important;
                }
            }

            /* Card style for mobile */
            .transaction-card {
                background: white;
                border-radius: 12px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                padding: 16px;
                margin-bottom: 12px;
                border: 1px solid #e5e7eb;
            }

            .transaction-card .label {
                font-size: 12px;
                color: #6b7280;
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .transaction-card .value {
                font-size: 15px;
                color: #1f2937;
                font-weight: 600;
            }

            /* Select in table/card */
            .inline-select {
                padding: 6px 28px 6px 10px;
                border-radius: 6px;
                border: 1px solid #d1d5db;
                font-size: 13px;
                cursor: pointer;
                background-color: #f9fafb;
                min-width: 100px;
            }

            .inline-select:focus {
                outline: none;
                border-color: #3b82f6;
                box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            }

            .inline-select.status-lunas {
                background-color: #dcfce7;
                border-color: #86efac;
                color: #166534;
            }

            .inline-select.status-belum {
                background-color: #fef3c7;
                border-color: #fcd34d;
                color: #92400e;
            }

            .inline-select.metode-cash {
                background-color: #dbeafe;
                border-color: #93c5fd;
                color: #1e40af;
            }

            .inline-select.metode-transfer {
                background-color: #f3e8ff;
                border-color: #c4b5fd;
                color: #6b21a8;
            }

            /* Table styles for desktop */
            @media (min-width: 768px) {
                .desktop-table {
                    display: table;
                }
                .mobile-cards {
                    display: none;
                }
            }

            @media (max-width: 767px) {
                .desktop-table {
                    display: none;
                }
                .mobile-cards {
                    display: block;
                }
            }

            /* Smooth transitions */
            .inline-select {
                transition: all 0.2s ease;
            }

            /* Action buttons */
            .btn-action {
                padding: 6px 10px;
                border-radius: 6px;
                font-size: 14px;
                cursor: pointer;
                transition: all 0.2s ease;
                border: none;
            }

            .btn-edit {
                background-color: #fef3c7;
                color: #92400e;
            }

            .btn-edit:hover {
                background-color: #fde68a;
            }

            .btn-delete {
                background-color: #fee2e2;
                color: #dc2626;
            }

            .btn-delete:hover {
                background-color: #fecaca;
            }

            /* Inline edit input */
            .inline-input {
                width: 60px;
                padding: 6px 8px;
                border-radius: 6px;
                border: 2px solid #3b82f6;
                font-size: 14px;
                text-align: center;
                background-color: #eff6ff;
            }

            .inline-input:focus {
                outline: none;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            }

            /* Modal */
            .modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.5);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                padding: 16px;
            }

            .modal-content {
                background: white;
                border-radius: 16px;
                padding: 24px;
                width: 100%;
                max-width: 320px;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            }

            .modal-hidden {
                display: none;
            }
        </style>
    </head>
    <body class="bg-gray-100 min-h-screen">
        <div class="max-w-2xl mx-auto p-4 sm:p-6">
            <div class="bg-white p-5 sm:p-6 rounded-xl shadow-lg">
                <h1
                    class="text-2xl sm:text-3xl font-bold text-center text-gray-800 mb-6"
                >
                    myDuren
                </h1>

                <!-- Form Input -->
                <div class="space-y-4">
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Stok Awal (box):</label
                        >
                        <input
                            type="number"
                            id="stokAwal"
                            value="100"
                            class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
                        />
                    </div>
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Nama Pembeli:</label
                        >
                        <input
                            type="text"
                            id="namaPembeli"
                            placeholder="Masukkan nama pembeli"
                            class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
                        />
                    </div>
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Jumlah Box Terjual:</label
                        >
                        <input
                            type="number"
                            id="jumlahTerjual"
                            placeholder="Masukkan jumlah box terjual"
                            class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
                        />
                    </div>
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Jenis Pembeli:</label
                        >
                        <select
                            id="jenisPembeli"
                            class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
                        >
                            <option value="reguler">
                                Reguler (Rp 35.000/box)
                            </option>
                            <option value="reseller">
                                Reseller (Rp 30.000/box)
                            </option>
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Status Pembayaran:</label
                        >
                        <select
                            id="statusPembayaran"
                            class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
                        >
                            <option value="lunas">Lunas</option>
                            <option value="belum lunas">Belum Lunas</option>
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1"
                            >Metode Pembayaran:</label
                        >
                        <select
                            id="metodePembayaran"
                            class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
                        >
                            <option value="cash">Cash</option>
                            <option value="transfer">Transfer</option>
                        </select>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3 pt-2">
                        <button
                            id="hitungButton"
                            class="flex-1 bg-blue-500 text-white px-4 py-3 rounded-lg font-semibold hover:bg-blue-600 active:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors text-base"
                        >
                            Tambah Penjualan
                        </button>
                        <button
                            id="resetButton"
                            class="flex-1 bg-red-500 text-white px-4 py-3 rounded-lg font-semibold hover:bg-red-600 active:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-colors text-base"
                        >
                            Reset Semua
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabel Penjualan - Desktop -->
            <div
                class="mt-6 bg-white rounded-xl shadow-lg overflow-hidden desktop-table"
            >
                <div class="px-5 py-4 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-800">
                        Daftar Penjualan
                    </h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50">
                                <th
                                    class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider"
                                >
                                    Nama
                                </th>
                                <th
                                    class="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider"
                                >
                                    Box
                                </th>
                                <th
                                    class="px-4 py-3 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider"
                                >
                                    Total
                                </th>
                                <th
                                    class="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider"
                                >
                                    Status
                                </th>
                                <th
                                    class="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider"
                                >
                                    Metode
                                </th>
                                <th
                                    class="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider"
                                >
                                    Edit
                                </th>
                            </tr>
                        </thead>
                        <tbody
                            id="tabelPenjualan"
                            class="divide-y divide-gray-200"
                        ></tbody>
                    </table>
                </div>
                <div
                    id="emptyStateDesktop"
                    class="px-5 py-8 text-center text-gray-400 hidden"
                >
                    Belum ada transaksi
                </div>
            </div>

            <!-- Kartu Penjualan - Mobile -->
            <div class="mt-6 mobile-cards">
                <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-4">
                    <div class="px-5 py-4 border-b border-gray-200">
                        <h2 class="text-lg font-semibold text-gray-800">
                            📋 Daftar Penjualan
                        </h2>
                    </div>
                </div>
                <div id="cardPenjualan"></div>
                <div
                    id="emptyStateMobile"
                    class="bg-white rounded-xl shadow-lg px-5 py-8 text-center text-gray-400 hidden"
                >
                    Belum ada transaksi
                </div>
            </div>

            <!-- Total Keuangan -->
            <div class="mt-6 bg-white rounded-xl shadow-lg p-5">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">
                    Total Keuangan
                </h2>
                <div class="grid grid-cols-2 gap-4">
                    <div
                        class="bg-yellow-50 rounded-lg p-4 border border-yellow-200"
                    >
                        <p
                            class="text-xs font-medium text-yellow-700 uppercase tracking-wide"
                        >
                            Belum Lunas
                        </p>
                        <p class="text-xl font-bold text-yellow-800 mt-1">
                            Rp <span id="totalBelumLunas">0</span>
                        </p>
                    </div>
                    <div
                        class="bg-green-50 rounded-lg p-4 border border-green-200"
                    >
                        <p
                            class="text-xs font-medium text-green-700 uppercase tracking-wide"
                        >
                            Lunas
                        </p>
                        <p class="text-xl font-bold text-green-800 mt-1">
                            Rp <span id="totalLunas">0</span>
                        </p>
                    </div>
                    <div
                        class="bg-blue-50 rounded-lg p-4 border border-blue-200"
                    >
                        <p
                            class="text-xs font-medium text-blue-700 uppercase tracking-wide"
                        >
                            Cash
                        </p>
                        <p class="text-xl font-bold text-blue-800 mt-1">
                            Rp <span id="totalCash">0</span>
                        </p>
                    </div>
                    <div
                        class="bg-purple-50 rounded-lg p-4 border border-purple-200"
                    >
                        <p
                            class="text-xs font-medium text-purple-700 uppercase tracking-wide"
                        >
                            Transfer
                        </p>
                        <p class="text-xl font-bold text-purple-800 mt-1">
                            Rp <span id="totalTransfer">0</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Edit -->
        <div id="editModal" class="modal-overlay modal-hidden">
            <div class="modal-content">
                <h3 class="text-lg font-bold text-gray-800 mb-4">
                    Edit Jumlah Box
                </h3>
                <div class="mb-4">
                    <p class="text-sm text-gray-600 mb-1">
                        Pembeli:
                        <span
                            id="editNama"
                            class="font-semibold text-gray-800"
                        ></span>
                    </p>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2"
                        >Jumlah Box Baru:</label
                    >
                    <input
                        type="number"
                        id="editJumlahInput"
                        min="1"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base text-center"
                    />
                </div>
                <div class="flex gap-3">
                    <button
                        id="cancelEditBtn"
                        class="flex-1 px-4 py-3 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition-colors"
                    >
                        Batal
                    </button>
                    <button
                        id="saveEditBtn"
                        class="flex-1 px-4 py-3 bg-blue-500 text-white rounded-lg font-semibold hover:bg-blue-600 transition-colors"
                    >
                        Simpan
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
